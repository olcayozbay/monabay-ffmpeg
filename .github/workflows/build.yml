name: ffmpeg-mp2
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Araclar
        run: sudo apt-get update && sudo apt-get install -y yasm nasm make

      - name: NDK ve CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125" "cmake;3.22.1" > /dev/null || true
          echo "NDK=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Kaynak kodlari indir
        run: |
          git clone --depth 1 --branch 1.5.0 https://github.com/androidx/media.git
          git clone --depth 1 --branch release/6.0 https://github.com/FFmpeg/FFmpeg.git ffmpeg

      - name: FFmpeg derle (MP2 dahil)
        run: |
          MOD="$GITHUB_WORKSPACE/media/libraries/decoder_ffmpeg/src/main"
          ln -s "$GITHUB_WORKSPACE/ffmpeg" "$MOD/jni/ffmpeg"
          cd "$MOD/jni"
          ./build_ffmpeg.sh "$MOD" "$NDK" "linux-x86_64" 21 mp2 mp3 aac ac3 eac3 dca mlp truehd vorbis opus flac alac pcm_mulaw pcm_alaw amrnb amrwb

      - name: AAR paketle
        run: |
          cd media
          ./gradlew :lib-decoder-ffmpeg:assembleRelease --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          find . -name "*.aar" -path "*decoder_ffmpeg*" -exec cp {} "$GITHUB_WORKSPACE/out/monabay_ffmpeg.aar" \;
          ls -la "$GITHUB_WORKSPACE/out"

      - name: Sonucu yukle
        uses: actions/upload-artifact@v4
        with:
          name: monabay_ffmpeg
          path: out/monabay_ffmpeg.aar
